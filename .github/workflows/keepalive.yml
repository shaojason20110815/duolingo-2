name: Keep Workflows Alive
on:
  schedule:
    - cron: "0 0 * * *"  # 每天 UTC 0 点检查一次
  workflow_dispatch:      # 保留手动触发，方便测试

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write   # 关键：必须保留此权限，API 模式需要它来重置计时器
    steps:
      - uses: actions/checkout@v4
      - uses: liskin/gh-workflow-keepalive@v1   # 替换为这个健康的工具
